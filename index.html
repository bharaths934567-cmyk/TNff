<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f8a70">
<title>TNPSC Prep – CBT Mock Tests</title>
<meta name="description" content="TNPSC CBT mock tests, daily quizzes, smart revision – offline ready.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4efe6; --bg2:#ebe3d6; --card:#fffdf9; --card2:#fbf6ec;
  --ink:#1a2429; --mute:#6b7a80; --line:#e4d9c8;
  --acc:#1f8a70; --acc-ink:#0e5f4b; --acc-soft:#e3f3ec;
  --ok:#1f8a4c; --ok-soft:#e3f6ea;
  --no:#c5392f; --no-soft:#fdeae8;
  --mk:#7b4fc9; --mk-soft:#efe7fb;
  --sh:0 8px 30px -8px rgba(60,40,10,.14), 0 2px 6px rgba(60,40,10,.04);
  --r:20px; --r-sm:12px;
  color-scheme: light dark;
  padding-top:env(safe-area-inset-top,0);
  padding-bottom:env(safe-area-inset-bottom,0);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --bg:#0c1418; --bg2:#121d22; --card:#152026; --card2:#1a262d;
    --ink:#eaf2ef; --mute:#8fa3a0; --line:#243338;
    --acc:#4fd6b3; --acc-ink:#a8f0da; --acc-soft:#123029;
    --ok:#6fe39a; --ok-soft:#15311f;
    --no:#ff8f86; --no-soft:#3a1a17;
    --mk:#b99cf5; --mk-soft:#241a3a;
    --sh:0 10px 40px -12px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.3);
  }
}
:root[data-theme=dark]{
  --bg:#0c1418; --bg2:#121d22; --card:#152026; --card2:#1a262d;
  --ink:#eaf2ef; --mute:#8fa3a0; --line:#243338;
  --acc:#4fd6b3; --acc-ink:#a8f0da; --acc-soft:#123029;
  --ok:#6fe39a; --ok-soft:#15311f;
  --no:#ff8f86; --no-soft:#3a1a17;
  --mk:#b99cf5; --mk-soft:#241a3a;
  --sh:0 10px 40px -12px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.3);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.65 "Noto Sans Tamil","Latha",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-weight:500;transition:transform .12s ease, border-color .2s, background .2s}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,label:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.p{background:var(--acc);border-color:var(--acc);color:#062018;font-weight:700}
button.p:hover{filter:brightness(1.05)}
button.w{width:100%;margin-top:12px;padding:14px;font-size:1.02rem}
button.ghost{background:transparent}
input,select{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;width:100%;transition:border-color .2s}
input:focus,select:focus{border-color:var(--acc)}
label{display:block;margin:14px 0 6px;color:var(--mute);font-size:.88rem;font-weight:500}
.wrap{max-width:1080px;margin:0 auto;padding:16px 14px 110px}
.hd{display:flex;gap:10px;align-items:center;margin:4px 0 20px;flex-wrap:wrap}
.hd .logo{font-weight:800;font-size:1.18rem;margin-right:auto;display:flex;gap:10px;align-items:center;letter-spacing:-.02em}
.hd .logo i{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,var(--acc),#6ad5b8);display:grid;place-items:center;font-style:normal;font-size:1.15rem;box-shadow:0 6px 18px -6px var(--acc)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{padding:8px 12px;font-size:.9rem;border-radius:12px}
.nav button.p{background:var(--acc);border-color:var(--acc);color:#062018}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:0 0 16px;box-shadow:var(--sh)}
.ctr{text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.mt{margin-top:16px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.act{text-align:left;padding:20px;border-radius:var(--r);font-size:1rem;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);transition:transform .15s ease, box-shadow .2s, border-color .2s;position:relative;overflow:hidden}
.act:hover{transform:translateY(-2px);border-color:var(--acc)}
.act b{display:block;font-size:1.05rem;margin-bottom:4px;font-weight:700}
.act span{color:var(--mute);font-size:.88rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin:16px 0}
.stats div{background:var(--acc-soft);border-radius:16px;padding:14px;color:var(--mute);font-size:.82rem;font-weight:500;letter-spacing:.02em}
.stats b{display:block;font-size:1.55rem;color:var(--ink);font-weight:800;margin-top:2px;letter-spacing:-.02em}
.ok{color:var(--ok)!important}
.no{color:var(--no)!important}
.pill{background:var(--acc-soft);color:var(--acc-ink);padding:5px 14px;border-radius:99px;font-weight:700;font-size:.9rem;border:1px solid color-mix(in srgb, var(--acc) 25%, transparent)}
.pill.warn{background:var(--no-soft);color:var(--no);border-color:color-mix(in srgb,var(--no) 25%,transparent)}
.ex{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
@media(max-width:860px){.ex{grid-template-columns:1fr}}
.q{font-size:1.22rem;font-weight:600;line-height:1.7;margin:16px 0 20px;letter-spacing:-.01em}
.o{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;margin:10px 0;padding:14px 16px;border:2px solid var(--line);border-radius:16px;background:var(--card);font-weight:500;transition:all .18s ease}
.o:hover{border-color:color-mix(in srgb,var(--acc) 40%,var(--line));background:var(--card2)}
.o i{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;background:var(--acc-soft);color:var(--acc-ink);font-size:.9rem;transition:all .18s}
.o.sel{border-color:var(--acc);background:var(--acc-soft);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 12%,transparent)}
.o.sel i{background:var(--acc);color:#062018}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;margin:12px 0;max-height:44vh;overflow:auto;padding:4px}
.pal button{padding:9px 0;border-radius:11px;font-weight:700;font-size:.9rem;background:var(--card2);border:1.5px solid var(--line);color:var(--mute)}
.pal .u{background:var(--no-soft);color:var(--no);border-color:color-mix(in srgb,var(--no) 30%,transparent)}
.pal .a{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.pal .m,.pal .am{background:var(--mk-soft);color:var(--mk);border-color:color-mix(in srgb,var(--mk) 30%,transparent)}
.pal .am{box-shadow:inset 0 -4px 0 var(--ok)}
.pal .cur{outline:3px solid var(--acc);outline-offset:2px;color:var(--ink);background:var(--card)}
.ring{width:150px;height:150px;border-radius:50%;margin:8px auto 14px;display:grid;place-items:center;background:conic-gradient(var(--acc) calc(var(--p,0)*1%), var(--line) 0);transition:background .6s ease}
.ring b{width:118px;height:118px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:2rem;font-weight:800;letter-spacing:-.03em}
.rv{border-left:5px solid var(--line)}
.rv.c{border-left-color:var(--ok)}
.rv.x{border-left-color:var(--no)}
.ex-t{white-space:pre-wrap;background:var(--acc-soft);border-radius:12px;padding:10px 14px;margin-top:10px;font-size:.94rem;line-height:1.6}
.ex-t:empty{display:none}
.ex-t:not(:empty)::before{content:"✨ ";font-weight:700}
table{width:100%;border-collapse:collapse}
td,th{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:.92rem}
th{color:var(--mute);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.06em}
tr:last-child td{border-bottom:none}
.hide{display:none}
.tin{color:var(--mute);font-size:.88rem;line-height:1.6}
.kbd{display:inline-block;padding:1px 7px;border:1px solid var(--line);border-radius:6px;font-family:ui-monospace,monospace;font-size:.8rem;background:var(--card2)}
@media(max-width:640px){
  .wrap{padding:12px 12px 96px}
  .hd{display:none}
  .tabbar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0));display:flex;justify-content:space-around;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border:1px solid var(--line);border-radius:22px;padding:8px;box-shadow:0 12px 32px -8px rgba(0,0,0,.25);z-index:50}
  .tabbar button{flex:1;background:transparent;border:none;border-radius:14px;padding:10px 4px;font-size:.72rem;font-weight:600;color:var(--mute);display:flex;flex-direction:column;gap:3px;align-items:center}
  .tabbar button i{font-style:normal;font-size:1.3rem}
  .tabbar button.p{color:var(--acc);background:var(--acc-soft)}
  .stats{grid-template-columns:repeat(2,1fr)}
  .q{font-size:1.1rem}
  .ring{width:120px;height:120px}.ring b{width:94px;height:94px;font-size:1.6rem}
}
@media(min-width:641px){.tabbar{display:none}}
@media print{
  .noprint,.hd,.tabbar,button{display:none!important}
  body{background:#fff;color:#000}
  .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .ring{background:#e0e0e0!important}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="tabbar noprint" id="tabs"></div>
<input type="file" id="fi" accept=".json,application/json" hidden>
<script>
/* ============================================================
   BANK — Question bank (Tamil). Do not edit unless adding Qs.
   ============================================================ */
const BANK=[
{q:"திருமண வயதுச் சட்டம் முதன் முறையாக எப்போது இயற்றப்பட்டது?",o:["1875","1829","1929","1860"],a:3},
{q:"திருமண வயது சட்டம் யாருடைய காலத்தில் இயற்றப்பட்டது?",o:["அய்யன்காளி","ஈஸ்வர் சந்திர வித்யாசாகர்","ஆத்மாராம் பாண்டுரங்","சுவாமி விவேகானந்தர்"],a:1},
{q:"திருமண வயது ஒப்புதல் கமிட்டி தொடங்கப்பட்ட ஆண்டு?",o:["1875","1829","1929","1860"],a:2},
{q:"1860 - இல் திருமணத்திற்காக நிர்ணயம் செய்யப்பட்ட வயது?",o:["10","12","13","14"],a:0},
{q:"1891 - இல் திருமணத்திற்காக நிர்ணயம் செய்யப்பட்ட வயது?",o:["10","12","13","14"],a:1},
{q:"1925 - இல் திருமணத்திற்காக நிர்ணயம் செய்யப்பட்ட வயது?",o:["10","12","13","14"],a:2},
{q:"வங்கப் பிரிவினை நடைபெற்ற ஆண்டு?",o:["1905","1916","1917","1918"],a:0},
{q:"சுதேசி இயக்கம் ஏற்படுத்தப்பட்ட ஆண்டு?",o:["1905","1916","1917","1918"],a:0},
{q:"தன்னாட்சி இயக்கம் ஏற்படுத்தப்பட்ட ஆண்டு?",o:["1905","1916","1917","1918"],a:1},
{q:"லக்னோ ஒப்பந்தம் ஏற்படுத்தப்பட்ட ஆண்டு?",o:["1905","1916","1917","1918"],a:1},
{q:"சம்பரான் சத்தியாகிரகம் நடைபெற்ற ஆண்டு?",o:["1905","1916","1917","1918"],a:2},
{q:"கேதா சத்தியாகிரகம் நடைபெற்ற ஆண்டு?",o:["1905","1916","1917","1918"],a:3},
{q:"ரௌலட் சட்டம் ஏற்படுத்தப்பட்ட ஆண்டு?",o:["1919","1920","1923","1927"],a:0},
{q:"ஜாலியன் வாலாபாக் படுகொலை நடைபெற்ற ஆண்டு?",o:["1919","1920","1923","1927"],a:0},
{q:"ஒத்துழையாமை இயக்கம் ஏற்படுத்தப்பட்ட ஆண்டு?",o:["1919","1920","1923","1927"],a:1},
{q:"சைமன் குழு நியமிக்கப்பட்ட ஆண்டு?",o:["1922","1927","1928","1923"],a:1},
{q:"உப்பு சத்தியாகிரகம் நடைபெற்ற ஆண்டு?",o:["1928","1929","1930","1931"],a:2},
{q:"முதல் வட்டமேசை மாநாடு நடைபெற்ற ஆண்டு?",o:["1928","1929","1930","1931"],a:2},
{q:"காந்தி - இர்வின் ஒப்பந்தம் ஏற்படுத்தப்பட்ட ஆண்டு?",o:["1928","1929","1930","1931"],a:3},
{q:"இந்திய அரசுச் சட்டம் மூலமாக இரட்டை ஆட்சி எந்த ஆண்டு அறிமுகம் செய்யப்பட்டது?",o:["1935","1948","1927","1919"],a:3},
{q:"சௌரி சௌரா சம்பவம் நடைபெற்ற ஆண்டு?",o:["1922","1927","1928","1923"],a:0},
{q:"சுயராஜ்ஜியக் கட்சி எப்போது தோற்றுவிக்கப்பட்டது?",o:["1922","1927","1928","1923"],a:3},
{q:"லாகூர் காங்கிரஸ் மாநாடு நடைபெற்ற ஆண்டு?",o:["1928","1929","1930","1931"],a:1},
{q:"இரண்டாவது வட்டமேசை மாநாடு நடைபெற்ற ஆண்டு?",o:["1928","1929","1930","1931"],a:3},
{q:"மூன்றாவது வட்டமேசை மாநாடு நடைபெற்ற ஆண்டு?",o:["1932","1929","1930","1931"],a:0},
{q:"ஆந்திரப் பிரதேசத்தின் தலைநகர்?",o:["ஹைதராபாத்","சித்தூர்","அமராவதி","கடப்பா"],a:2},
{q:"புலிகள் பாதுகாப்புத் திட்டம் எப்போது தொடங்கப்பட்டது?",o:["1950","1963","1973","2008"],a:2},
{q:"காரகோரம் கணவாய் எங்குள்ளது?",o:["சிக்கிம்","இமாச்சலப் பிரதேசம்","ஜம்மு காஷ்மீர்","அருணாச்சலப் பிரதேசம்"],a:2},
{q:"பொமிடிலா கணவாய் எங்குள்ளது?",o:["சிக்கிம்","இமாச்சலப் பிரதேசம்","ஜம்மு காஷ்மீர்","அருணாச்சலப் பிரதேசம்"],a:3},
{q:"நாதுலா கணவாய் எங்குள்ளது?",o:["சிக்கிம்","இமாச்சலப் பிரதேசம்","ஜம்மு காஷ்மீர்","அருணாச்சலப் பிரதேசம்"],a:0},
{q:"பாகிஸ்தானையும் ஆப்கானிஸ்தானையும் இணைக்கும் கணவாய்?",o:["போலன் கணவாய்","கைபர் கணவாய்","காரகோரம் கணவாய்","ஜெலிப்லா கணவாய்"],a:1},
{q:"போலன் கணவாய் எந்த நாட்டில் உள்ளது?",o:["இந்தியா","அமெரிக்கா","பாகிஸ்தான்","சீனா"],a:2},
{q:"உலகில் மிக அதிக அளவு மழை பெறும் பகுதி?",o:["மௌசின்ராம்","சிரபுஞ்சி","சின்னக்கல்லார்","ஜெய்சால்மர்"],a:0},
{q:"மௌசின்ராம் எந்த மாநிலத்தில் உள்ளது?",o:["பஞ்சாப்","தமிழ்நாடு","ராஜஸ்தான்","மேகாலயா"],a:3},
{q:"இந்திய நிலவியல் கள ஆய்வு நிறுவனத்தின் தலைமையிடம் எங்குள்ளது?",o:["கொல்கத்தா","ஒடிசா","ஹைதராபாத்","நாக்பூர்"],a:0},
{q:"தேசிய அலுமினிய நிறுவனத்தின் (NALCO) தலைமையிடம் எங்குள்ளது?",o:["கொல்கத்தா","ஒடிசா","ஹைதராபாத்","நாக்பூர்"],a:1},

function applyTheme(){

  if(SS.mode!=="mock"){
    return hd()+`<div class="card">${top}<div class="q">${SS.cur+1}. ${esc(q.q)}</div>${opts}${nav}${kbd}
    <button class="p w" onclick="submit()">தேர்வை சமர்ப்பி (${cntAns()}/${n})</button></div>`;
  }
  const pal=SS.qs.map((_,i)=>{
    const an=SS.ans[i]!=null,m=SS.mk[i],cls=an&&m?"am":an?"a":m?"m":"u";
    return `<button class="${cls}${i===SS.cur?" cur":""}" onclick="jump(${i})">${i+1}</button>`;
  }).join("");
  return hd()+`<div class="ex"><div class="card">${top}<div class="q">${SS.cur+1}. ${esc(q.q)}</div>${opts}${nav}${kbd}</div>
  <div><div class="card"><b>கேள்வி அட்டவணை</b><div class="pal">${pal}</div>
  <div class="tin"><span style="color:var(--ok)">&#9679;</span> பதிலளித்தது ${cntAns()} · <span style="color:var(--mk)">&#9679;</span> குறித்தது ${SS.mk.filter(Boolean).length} · <span style="color:var(--no)">&#9679;</span> மீதம் ${n-cntAns()}</div>
  <button class="p w" onclick="submit()">தேர்வை சமர்ப்பி</button></div></div></div>`;
}

function vResult(){
  const r=LAST;if(!r)return vHome();
  const pct=r.tot?Math.round(r.ok*100/r.tot):0;
  const skip=r.det.filter(d=>d[1]==null).length,wrong=r.tot-r.ok-skip;
  return hd()+`<div class="card ctr"><span class="pill">${MODES[r.m]}</span>
  <div class="ring" style="--p:${pct}"><b>${pct}<span style="font-size:1rem">%</span></b></div>
  <p style="margin:0;font-size:1.05rem"><b>${r.ok}</b> / ${r.tot} சரியான விடைகள்</p>
  <p style="margin:8px 0 0"><span class="pill${pct>=60?"":" warn"}">${pct>=60?"வெற்றி – நன்று!":"மேலும் பயிற்சி தேவை"}</span></p>
  <div class="stats"><div>சரி<b class="ok">${r.ok}</b></div><div>தவறு<b class="no">${wrong}</b></div><div>விடப்பட்டவை<b>${skip}</b></div><div>நேரம்<b>${fmt(r.u)}</b></div></div>
  <div class="row" style="justify-content:center"><button onclick="openRev('last')">மறுபரிசீலனை</button><button class="p" onclick="go('home')">முகப்பு</button></div></div>`;
}

function curRev(){return RA==="last"?LAST:D.hist[RA]}
function vReview(){
  const r=curRev();if(!r)return vHome();
  const items=r.det.map((d,i)=>{
    const ok=d[1]===d[2];
    const lines=(d[3]||[]).map((t,j)=>{
      const good=j===d[2],mine=j===d[1];
      const st=good?"color:var(--ok);font-weight:700":mine?"color:var(--no);font-weight:700":"";
      const tag=good?" – சரியான விடை":mine?" – உங்கள் விடை":"";
      return `<div class="tin" style="${st}">${j+1}. ${esc(t)}${tag}</div>`;
    }).join("");
    return `<div class="rv ${ok?"c":"x"} card" style="margin:0 0 12px">
    <div class="tin">கேள்வி ${i+1} · ${ok?"சரியான விடை":"தவறான விடை"}</div>
    <div class="q" style="font-size:1.02rem;margin:6px 0 10px">${esc(d[0])}</div>
    ${lines}
    ${d[4]?`<div class="ex-t">${esc(d[4])}</div>`:""}
    </div>`;
  }).join("");
  return hd()+`<div class="card noprint"><div class="row sp"><span class="pill">${MODES[r.m]} · மறுபரிசீலனை</span>
  <span class="row"><button onclick="printNow()">${IC.print} அச்சிடு</button><button class="p" onclick="go('home')">முகப்பு</button></span></div></div>${items}`;
}

function vHist(){
  const rows=D.hist.map((h,i)=>`<tr><td>${new Date(h.t).toLocaleDateString("ta-IN",{day:"numeric",month:"short"})}</td><td>${MODES[h.m]||h.m}</td><td>${h.ok} / ${h.tot}</td><td>${Math.round(h.ok*100/h.tot)}%</td><td><button onclick="openRev(${i})" style="padding:6px 12px;font-size:.85rem">பார்</button></td></tr>`).join("");
  return hd()+`<div class="card"><div class="row sp"><h3 style="margin:0">தேர்வு வரலாறு</h3><span class="pill">${D.hist.length} முயற்சிகள்</span></div>
  ${D.hist.length?`<table style="margin-top:10px"><tr><th>தேதி</th><th>வகை</th><th>மதிப்பெண்</th><th>%</th><th></th></tr>${rows}</table>`:`<p class="tin" style="margin:10px 0 0">இன்னும் தேர்வு எழுதப்படவில்லை. முகப்புப் பக்கத்திலிருந்து ஒரு தேர்வைத் தொடங்குங்கள்.</p>`}</div>`;
}

function vSet(){
  return hd()+`
  <div class="card"><h3 style="margin:0 0 4px">தோற்றம்</h3>
  <label>நிறத் தோற்றம்</label>
  <select onchange="setTheme(this.value)">
    <option value="system"${D.theme==="system"?" selected":""}>அமைப்பு முறைமையைப் பின்பற்று</option>
    <option value="light"${D.theme==="light"?" selected":""}>ஒளி</option>
    <option value="dark"${D.theme==="dark"?" selected":""}>இருள்</option>
  </select></div>
  <div class="card"><h3 style="margin:0 0 4px">வினா வங்கி</h3>
  <p class="tin" style="margin:4px 0 10px">அடிப்படை ${BANK.length} · நீங்கள் சேர்த்தவை ${D.custom.length} · மொத்தம் ${ALL().length}</p>
  <div class="row">
    <button onclick="pickFile()">${IC.imp} இறக்குமதி</button>
    <button onclick="exportQ()">${IC.exp} ஏற்றுமதி</button>
    <button class="ghost" style="color:var(--no)" onclick="wipe()">அனைத்துத் தரவையும் அழி</button>
  </div>
  <p class="tin" style="margin:10px 0 0">இறக்குமதி வடிவம்: <span class="kbd">[{"q":"...","o":["...","..."],"a":0}]</span> – <span class="kbd">e</span> என்ற புலத்தில் விளக்கம் தரலாம்.</p></div>
  <div class="card"><h3 style="margin:0 0 4px">பற்றி</h3><p class="tin" style="margin:4px 0 0">TNPSC Prep – CBT Mock Tests · பதிப்பு tnpsc-v2 · ஆஃப்லைன் PWA. உங்கள் தரவு அனைத்தும் சாதனத்திலேயே சேமிக்கப்படும்.</p></div>`;
}

function vPaper(){
  const qs=shuf(ALL()).slice(0,25);
  const items=qs.map((q,i)=>`<div class="rv card" style="margin:0 0 12px"><div class="q" style="font-size:1.05rem;margin:0 0 8px">${i+1}. ${esc(q.q)}</div>
  ${q.o.map((t,j)=>`<div class="tin">(${j+1}) ${esc(t)}</div>`).join("")}</div>`).join("");
  return hd()+`<div class="card ctr noprint"><span class="pill">பயிற்சி வினாத்தாள் · ${qs.length} கேள்விகள்</span>
  <p class="tin" style="margin:8px 0 0">விடைகள் அச்சிடப்படாது. மதிப்பீட்டுக்கு முகப்பில் உள்ள தேர்வுகளை எழுதுங்கள்.</p>
  <button class="p" style="margin-top:10px" onclick="printNow()">${IC.print} அச்சிடு</button></div>${items}`;
}

/* ---- exam engine ---- */
function begin(mode,n,dur,pool){
  const src=pool||ALL();
  const qs=shuf(src).slice(0,Math.min(n,src.length));
  SS={mode,qs,ans:qs.map(()=>null),mk:qs.map(()=>false),cur:0,t0:Date.now(),dur:dur||0,left:dur||0,iv:null};
  if(dur)SS.iv=setInterval(tick,1000);
  RT="exam";render();
}
function tick(){
  if(!SS)return;
  SS.left--;
  const t=document.getElementById("tm");
  if(t){t.textContent=fmt(Math.max(0,SS.left));if(SS.left<=60)t.classList.add("warn")}
  if(SS.left<=0){toast("நேரம் முடிந்தது – தேர்வு தானாக சமர்ப்பிக்கப்படுகிறது");submit(true)}
}
function pick(i){if(!SS)return;SS.ans[SS.cur]=SS.ans[SS.cur]===i?null:i;render()}
function jump(i){if(!SS)return;SS.cur=i;render()}
function mv(d){if(!SS)return;SS.cur=Math.max(0,Math.min(SS.qs.length-1,SS.cur+d));render()}
function mark(){if(!SS)return;SS.mk[SS.cur]=!SS.mk[SS.cur];render()}
function cntAns(){return SS?SS.ans.filter(x=>x!=null).length:0}
function submit(auto){
  if(!SS)return;
  if(!auto&&!confirm("தேர்வை சமர்ப்பிக்கவா?"))return;
  clearInterval(SS.iv);
  const ok=SS.qs.reduce((s,q,i)=>s+(SS.ans[i]===q.a?1:0),0);
  const u=SS.mode==="mock"?Math.max(1,SS.dur-SS.left):Math.max(1,Math.round((Date.now()-SS.t0)/1000));
  const det=SS.qs.map((q,i)=>[q.q,SS.ans[i],q.a,q.o.slice(),q.e||""]);
  LAST={m:SS.mode,t:Date.now(),tot:SS.qs.length,ok,u,det};
  D.hist.push(LAST);
  if(SS.mode==="daily")D.daily={d:today(),ok:LAST.ok,tot:LAST.tot};
  save();SS=null;RA="last";RT="result";render();
}

/* ---- navigation ---- */
function go(r){
  if(SS){
    if(r==="tests"){if(RT!=="exam"){RT="exam";render()}return}
    if(RT==="exam"&&!confirm("நடந்து கொண்டிருக்கும் தேர்வை நிறுத்தவா?"))return;
    clearInterval(SS.iv);SS=null;
  }
  RT=r;render();
}
function openRev(i){RA=i;RT="review";render()}
function startMock(){begin("mock",25,25*60)}
function startQuick(){begin("quick",10,0)}
function startDaily(){
  if(D.daily&&D.daily.d===today()){toast("இன்றைய தினசரி வினா முடிந்தது – நாளை மீண்டும் வருங்கள்!");return}
  begin("daily",10,0);
}
function startRevise(){
  const w=new Map();
  D.hist.forEach(h=>h.det.forEach(d=>{if(d[1]!==d[2])w.set(d[0],d)}));
  if(w.size<5){toast("மீட்டலுக்குப் போதுமான தவறான விடைகள் இல்லை");return}
  const pool=[...w.values()].map(d=>{const s=ALL().find(x=>x.q===d[0]);return s||{q:d[0],o:d[3],a:d[2],e:d[4]}});
  begin("revise",Math.min(15,pool.length),0,pool);
}

/* ---- settings actions ---- */
function setTheme(v){D.theme=v;save();applyTheme();render()}
function pickFile(){$("#fi").click()}
function printNow(){window.print()}
function exportQ(){
  if(!D.custom.length){toast("சேர்க்கப்பட்ட கேள்விகள் இல்லை");return}
  const b=new Blob([JSON.stringify({app:"tnpsc-prep",questions:D.custom},null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="tnpsc-questions.json";a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),500);
}
function wipe(){
  if(!confirm("வரலாறு, தினசரி வினா மற்றும் சேர்த்த கேள்விகள் அனைத்தும் நீக்கப்படும். தொடரவா?"))return;
  D.hist=[];D.custom=[];D.daily=null;LAST=null;save();
  toast("அனைத்துத் தரவும் அழிக்கப்பட்டது");render();
}

/* ---- toast ---- */
let TT=null;
function toast(m){
  let t=document.getElementById("toast");
  if(!t){
    t=document.createElement("div");t.id="toast";t.className="noprint";
    t.style.cssText="position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:.9rem;z-index:99;box-shadow:var(--sh);max-width:88vw;text-align:center;transition:opacity .3s;opacity:0";
    document.body.appendChild(t);
  }
  t.textContent=m;t.style.opacity="1";clearTimeout(TT);TT=setTimeout(()=>t.style.opacity="0",2600);
}

/* ---- import / validate ---- */
function normQ(x){
  if(!x||typeof x!=="object")return null;
  const q=String(x.q!=null?x.q:(x.question!=null?x.question:"")).trim();
  const o=Array.isArray(x.o)?x.o:(Array.isArray(x.options)?x.options:null);
  if(!q||!o||o.length<2||o.length>6)return null;
  const os=o.map(v=>String(v));
  const a=Number(x.a!=null?x.a:x.answer);
  if(!Number.isInteger(a)||a<0||a>=os.length)return null;
  return {q,o:os,a,e:x.e?String(x.e):""};
}
$("#fi").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0];e.target.value="";
  if(!f)return;
  let j;try{j=JSON.parse(await f.text())}catch(err){toast("தவறான JSON கோப்பு");return}
  const arr=Array.isArray(j)?j:(j&&Array.isArray(j.questions)?j.questions:null);
  if(!arr){toast('எதிர்பார்க்கும் வடிவம்: [{"q","o","a"}]');return}
  let ok=0,bad=0;const have=new Set(ALL().map(x=>x.q));
  arr.forEach(x=>{const n=normQ(x);if(n&&!have.has(n.q)){D.custom.push(n);have.add(n.q);ok++}else bad++});
  save();toast(ok+" கேள்விகள் சேர்க்கப்பட்டன"+(bad?", "+bad+" நிராகரிக்கப்பட்டன":""));
  if(RT!=="exam")render();
});

/* ---- keyboard shortcuts ---- */
addEventListener("keydown",e=>{
  if(RT!=="exam"||!SS)return;
  const tg=e.target&&e.target.tagName;
  if(tg==="INPUT"||tg==="SELECT"||tg==="TEXTAREA")return;
  if(/^[1-4]$/.test(e.key))pick(+e.key-1);
  else if(e.key==="ArrowRight")mv(1);
  else if(e.key==="ArrowLeft")mv(-1);
  else if(e.key==="m"||e.key==="M")mark();
  else if(e.key==="Enter"){if(SS.cur<SS.qs.length-1)mv(1);else submit()}
});

/* ---- render + boot ---- */
const TABS=[["home","முகப்பு",IC.home],["tests","தேர்வு",IC.test],["hist","வரலாறு",IC.hist],["set","அமைப்பு",IC.set]];
function renderTabs(){
  $("#tabs").innerHTML=TABS.map(t=>`<button class="${NAV[RT]===t[0]?"p":""}" onclick="go('${t[0]}')">${t[2]}<span>${t[1]}</span></button>`).join("");
}
const V={home:vHome,tests:vTests,exam:vExam,result:vResult,review:vReview,hist:vHist,set:vSet,paper:vPaper};
function render(){
  if(RT==="exam"&&!SS)RT="tests";
  if(RT==="result"&&!LAST)RT="home";
  if(RT==="review"&&!curRev())RT="hist";
  $("#app").innerHTML=(V[RT]||vHome)();
  renderTabs();
  window.scrollTo(0,0);
}
applyTheme();render();
if("serviceWorker"in navigator){addEventListener("load",()=>{navigator.serviceWorker.register("./sw.js").catch(()=>{})})}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TNPSC Prep – CBT Mock Tests</title>
<meta name="theme-color" content="#1f8a70">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1ea;--card:#fffdf9;--ink:#26323a;--mute:#6d7a80;--line:#e8dfd2;--acc:#1f8a70;--acc2:#e6f5f0;--ok:#1f8a4c;--okb:#e6f5ea;--no:#c5392f;--nob:#fcebe9;--mk:#7b4fc9;--sh:0 6px 24px rgba(60,40,10,.08);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121a1d;--card:#1a2528;--ink:#ecf2f0;--mute:#9db0ad;--line:#2b3a3d;--acc:#4fcfb0;--acc2:#16312d;--ok:#74dc95;--okb:#15321f;--no:#ff8f86;--nob:#3b1a18;--mk:#b99cf5;--sh:0 6px 24px rgba(0,0,0,.35)}}
:root[data-theme=dark]{--bg:#121a1d;--card:#1a2528;--ink:#ecf2f0;--mute:#9db0ad;--line:#2b3a3d;--acc:#4fcfb0;--acc2:#16312d;--ok:#74dc95;--okb:#15321f;--no:#ff8f86;--nob:#3b1a18;--mk:#b99cf5;--sh:0 6px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans Tamil","Latha",system-ui,sans-serif}
.wrap{max-width:1050px;margin:0 auto;padding:12px 14px 50px}
.hd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 14px}
.hd .logo{font-weight:700;font-size:1.15rem;margin-right:auto;display:flex;gap:8px;align-items:center}
.hd .logo i{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--acc),#6ad5b8);display:grid;place-items:center;font-style:normal}
.nav{display:flex;gap:6px;flex-wrap:wrap}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;transition:transform .1s,border-color .2s}
button:active{transform:scale(.97)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.p{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
button.w{width:100%;margin-top:10px;padding:12px}
input,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;width:100%}
label{display:block;margin:10px 0 2px;color:var(--mute);font-size:.9rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 14px;box-shadow:var(--sh)}
.ctr{text-align:center}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}.mt{margin-top:14px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.act{text-align:left;padding:16px;border-radius:16px;font-size:1rem}.act b{display:block;font-size:1.05rem}.act span{color:var(--mute);font-size:.85rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:12px 0}
.stats div{background:var(--acc2);border-radius:14px;padding:10px;color:var(--mute);font-size:.85rem}.stats b{display:block;font-size:1.4rem;color:var(--ink)}
.ok{color:var(--ok)!important}.no{color:var(--no)!important}
.pill{background:var(--acc2);color:var(--acc);padding:3px 12px;border-radius:99px;font-weight:700}
.ex{display:grid;grid-template-columns:1fr 290px;gap:14px;align-items:start}
@media(max-width:820px){.ex{grid-template-columns:1fr}}
.q{font-size:1.2rem;font-weight:600;line-height:1.65;margin:12px 0}
.o{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border:2px solid var(--line);border-radius:14px}
.o i{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;background:var(--acc2);color:var(--acc)}
.o.sel{border-color:var(--acc);background:var(--acc2)}.o.sel i{background:var(--acc);color:#fff}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:10px 0;max-height:46vh;overflow:auto}
.pal button{padding:6px 0;border-radius:10px;font-weight:600;background:var(--line)}
.pal .u{background:var(--nob);color:var(--no)}.pal .a{background:var(--okb);color:var(--ok)}.pal .m,.pal .am{background:var(--mk);color:#fff}.pal .am{box-shadow:inset 0 -4px 0 var(--ok)}.pal .cur{outline:3px solid var(--acc)}
.ring{width:130px;height:130px;border-radius:50%;margin:0 auto;display:grid;place-items:center;background:conic-gradient(var(--acc) calc(var(--p,0)*1%),var(--line) 0)}
.ring b{width:100px;height:100px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:1.8rem}
.rv{border-left:5px solid var(--line)}.rv.c{border-color:var(--ok)}.rv.x{border-color:var(--no)}
.ex-t{white-space:pre-wrap;background:var(--acc2);border-radius:12px;padding:8px 12px;margin-top:8px}.ex-t:empty{display:none}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:.92rem}
.hide{display:none}
@media print{.noprint,.hd,button{display:none!important}body{background:#fff}.card{box-shadow:none;break-inside:avoid}}
</style>
</head>

<input type="file" id="fi" accept=".json,application/json" hidden>
<script>
const BANK=[
{q:"திருமண வயதுச் சட்டம் முதன் முறையாக எப்போது இயற்றப்பட்டது?",o:["1875","1829","1929","1860"],a:3},
{q:"திருமண வயது சட்டம் யாருடைய காலத்தில் இயற்றப்பட்டது?",o:["அய்யன்காளி","ஈஸ்வர் சந்திர வித்யாசாகர்","ஆத்மாராம் பாண்டுரங்","சுவாமி விவேகானந்தர்"],a:1},
{q:"திருமண வயது ஒப்புதல் கமிட்டி தொடங்கப்பட்ட ஆண்டு?",o:["1875","1829","1929","1860"],a:2},
{q:"1860 - இல் திருமணத்திற்காக நிர்ணயம் செய்யப்பட்ட வயது?",o:["10","12","13","14"],a:0},
{q:"1891 - இல் திருமணத்திற்காக நிர்ணயம் செய்யப்பட்ட வயது?",o:["10","12","13","14"],a:1},
{q:"1925 - இல் திருமணத்திற்காக நிர்ணயம் செய்யப்பட்ட வயது?",o:["10","12","13","14"],a:2},
{q:"வங்கப் பிரிவினை நடைபெற்ற ஆண்டு?",o:["1905","1916","1917","1918"],a:0},
{q:"சுதேசி இயக்கம் ஏற்படுத்தப்பட்ட ஆண்டு?",o:["1905","1916","1917","1918"],a:0},
{q:"தன்னாட்சி இயக்கம் ஏற்படுத்தப்பட்ட ஆண்டு?",o:["1905","1916","1917","1918"],a:1},
{q:"லக்னோ ஒப்பந்தம் ஏற்படுத்தப்பட்ட ஆண்டு?",o:["1905","1916","1917","1918"],a:1},
{q:"சம்பரான் சத்தியாகிரகம் நடைபெற்ற ஆண்டு?",o:["1905","1916","1917","1918"],a:2},
{q:"கேதா சத்தியாகிரகம் நடைபெற்ற ஆண்டு?",o:["1905","1916","1917","1918"],a:3},
{q:"ரௌலட் சட்டம் ஏற்படுத்தப்பட்ட ஆண்டு?",o:["1919","1920","1923","1927"],a:0},
{q:"ஜாலியன் வாலாபாக் படுகொலை நடைபெற்ற ஆண்டு?",o:["1919","1920","1923","1927"],a:0},
{q:"ஒத்துழையாமை இயக்கம் ஏற்படுத்தப்பட்ட ஆண்டு?",o:["1919","1920","1923","1927"],a:1},
{q:"சைமன் குழு நியமிக்கப்பட்ட ஆண்டு?",o:["1922","1927","1928","1923"],a:1},
{q:"உப்பு சத்தியாகிரகம் நடைபெற்ற ஆண்டு?",o:["1928","1929","1930","1931"],a:2},
{q:"முதல் வட்டமேசை மாநாடு நடைபெற்ற ஆண்டு?",o:["1928","1929","1930","1931"],a:2},
{q:"காந்தி - இர்வின் ஒப்பந்தம் ஏற்படுத்தப்பட்ட ஆண்டு?",o:["1928","1929","1930","1931"],a:3},
{q:"இந்திய அரசுச் சட்டம் மூலமாக இரட்டை ஆட்சி எந்த ஆண்டு அறிமுகம் செய்யப்பட்டது?",o:["1935","1948","1927","1919"],a:3},
{q:"சௌரி சௌரா சம்பவம் நடைபெற்ற ஆண்டு?",o:["1922","1927","1928","1923"],a:0},
{q:"சுயராஜ்ஜியக் கட்சி எப்போது தோற்றுவிக்கப்பட்டது?",o:["1922","1927","1928","1923"],a:3},
{q:"லாகூர் காங்கிரஸ் மாநாடு நடைபெற்ற ஆண்டு?",o:["1928","1929","1930","1931"],a:1},
{q:"இரண்டாவது வட்டமேசை மாநாடு நடைபெற்ற ஆண்டு?",o:["1928","1929","1930","1931"],a:3},
{q:"மூன்றாவது வட்டமேசை மாநாடு நடைபெற்ற ஆண்டு?",o:["1932","1929","1930","1931"],a:0},
{q:"ஆந்திரப் பிரதேசத்தின் தலைநகர்?",o:["ஹைதராபாத்","சித்தூர்","அமராவதி","கடப்பா"],a:2},
{q:"புலிகள் பாதுகாப்புத் திட்டம் எப்போது தொடங்கப்பட்டது?",o:["1950","1963","1973","2008"],a:2},
{q:"காரகோரம் கணவாய் எங்குள்ளது?",o:["சிக்கிம்","இமாச்சலப் பிரதேசம்","ஜம்மு காஷ்மீர்","அருணாச்சலப் பிரதேசம்"],a:2},
{q:"பொமிடிலா கணவாய் எங்குள்ளது?",o:["சிக்கிம்","இமாச்சலப் பிரதேசம்","ஜம்மு காஷ்மீர்","அருணாச்சலப் பிரதேசம்"],a:3},
{q:"நாதுலா கணவாய் எங்குள்ளது?",o:["சிக்கிம்","இமாச்சலப் பிரதேசம்","ஜம்மு காஷ்மீர்","அருணாச்சலப் பிரதேசம்"],a:0},
{q:"பாகிஸ்தானையும் ஆப்கானிஸ்தானையும் இணைக்கும் கணவாய்?",o:["போலன் கணவாய்","கைபர் கணவாய்","காரகோரம் கணவாய்","ஜெலிப்லா கணவாய்"],a:1},
{q:"போலன் கணவாய் எந்த நாட்டில் உள்ளது?",o:["இந்தியா","அமெரிக்கா","பாகிஸ்தான்","சீனா"],a:2},
{q:"உலகில் மிக அதிக அளவு மழை பெறும் பகுதி?",o:["மௌசின்ராம்","சிரபுஞ்சி","சின்னக்கல்லார்","ஜெய்சால்மர்"],a:0},
{q:"மௌசின்ராம் எந்த மாநிலத்தில் உள்ளது?",o:["பஞ்சாப்","தமிழ்நாடு","ராஜஸ்தான்","மேகாலயா"],a:3},
{q:"இந்திய நிலவியல் கள ஆய்வு நிறுவனத்தின் தலைமையிடம் எங்குள்ளது?",o:["கொல்கத்தா","ஒடிசா","ஹைதராபாத்","நாக்பூர்"],a:0},
{q:"தேசிய அலுமினிய நிறுவனத்தின் (NALCO) தலைமையிடம் எங்குள்ளது?",o:["கொல்கத்தா","ஒடிசா","ஹைதராபாத்","நாக்பூர்"],a:1},
{q:"இந்திய நிலக்கரி நிறுவனத்தின் தலைமையிடம் எங்குள்ளது?",o:["ஒடிசா","கொல்கத்தா (மேற்கு வங்காளம்)","ஹைதராபாத்","நாக்பூர்"],a:1},
{q:"இந்திய மாங்கனீசு தாது நிறுவனத்தின் தலைமையிடம் எங்குள்ளது?",o:["கொல்கத்தா","ஒடிசா","ஹைதராபாத்","நாக்பூர்"],a:3},
{q:"செயில் (SAIL) நிறுவனத்தின் தலைமையிடம் எங்குள்ளது?",o:["மும்பை (மகாராஷ்டிரா)","டார்ஜிலிங்","ஃபரிதாபாத்","புதுடெல்லி"],a:3},
{q:"நாட்டின் மிகப்பெரிய எண்ணெய் வயல்?",o:["மும்பை ஹை","பேஸ்ஸைம்","அலியாபெத்","குஜராத் கடற்கரை"],a:0},
{q:"நாட்டின் மிகப் பழமையான எண்ணெய் வயல்?",o:["மும்பை ஹை","பேஸ்ஸைம்","அலியாபெத்","திக்பாய்"],a:3},
{q:"இந்தியாவில் உற்பத்தி செய்யும் திட்டம் (Make in India) எந்த ஆண்டு தொடங்கப்பட்டது?",o:["1986","2014","2003","1957"],a:1},
{q:"இந்தியாவின் முதல் மக்கள்தொகை கணக்கெடுப்பு எந்த ஆண்டு மேற்கொள்ளப்பட்டது?",o:["1881","1872","2011","1995"],a:1},
{q:"முழுமையான முதல் மக்கள்தொகை கணக்கெடுப்பு எந்த ஆண்டு மேற்கொள்ளப்பட்டது?",o:["1881","1872","2011","1995"],a:0},
{q:"நாட்டின் 15-வது மக்கள்தொகை கணக்கெடுப்பு எந்த ஆண்டு நடைபெற்றது?",o:["1881","1872","2011","1995"],a:2},
{q:"தேசிய நெடுஞ்சாலை ஆணையம் (NHAI) எந்த ஆண்டு நிறுவப்பட்டது?",o:["1881","1872","2011","1995"],a:3},
{q:"இந்தியாவின் மிக அதிகவேக இரயில்வண்டி?",o:["புல்லட்","துரந்தோ","தேஜஸ்","காத்திமன்"],a:3},
{q:"காத்திமன் அதிவிரைவு இரயில்வண்டி மணிக்கு எத்தனை கிலோமீட்டர் வேகத்தில் செல்லும்?",o:["180 கி.மீ","210 கி.மீ","160 கி.மீ","147 கி.மீ"],a:2},
{q:"மாநில மறுசீரமைப்புச் சட்டம் கொண்டுவரப்பட்ட ஆண்டு?",o:["2003","1947","1986","1956"],a:3},
{q:"மருதமலை, வெள்ளியங்கிரி மலை மற்றும் ஆனைமலை எந்த மாவட்டத்தில் உள்ளது?",o:["தர்மபுரி","கோயம்புத்தூர்","ஈரோடு","திண்டுக்கல்"],a:1},
{q:"பழனிமலை எந்த மாவட்டத்தில் உள்ளது?",o:["தர்மபுரி","கோயம்புத்தூர்","ஈரோடு","திண்டுக்கல்"],a:3},
{q:"நீலகிரிமலை எந்த மாவட்டத்தில் உள்ளது?",o:["திருநெல்வேலி","நீலகிரி","பெரம்பலூர்","விழுப்புரம்"],a:1},

shuf|Shuffle questions & options|கேள்வி/விருப்பங்களைக் கலக்கு
exp|Export JSON|JSON ஏற்றுமதி
imp|Import JSON|JSON இறக்குமதி
reset|Reset all data|தரவை அழி
cnt|Questions|வினாக்கள்
min|Minutes|நிமிடங்கள்
none|Nothing yet|இன்னும் எதுவுமில்லை
tests|Tests|தேர்வுகள்
avg|Avg accuracy|சராசரி துல்லியம்
best|Best score|சிறந்த மதிப்பெண்
bank|Question bank|வினா வங்கி
date|Date|தேதி
mode|Mode|வகை
save|Save|சேமி
ok|Saved|சேமிக்கப்பட்டது
bmt|Practice bookmarks|புக்மார்க் பயிற்சி
yours|Your answer|உங்கள் விடை
right2|Correct answer|சரியான விடை
note|Questions are in Tamil; the interface supports both languages.|வினாக்கள் தமிழில்; இடைமுகம் இரு மொழிகளில் உள்ளது.`.split("\n").forEach(x=>{const p=x.split("|");L[p[0]]=[p[1],p[2]]});
const LSK="tnpsc.v1",DF={profile:{name:"",exam:"TNUSRB"},hist:[],bm:[],st:{},set:{lang:"ta",theme:"auto",neg:.33,shuf:true,key:""},extra:[]};
let D;try{D=Object.assign({},DF,JSON.parse(localStorage.getItem(LSK)||"{}"))}catch(e){D=Object.assign({},DF)}
D.set=Object.assign({},DF.set,D.set);
const save=()=>{try{localStorage.setItem(LSK,JSON.stringify(D))}catch(e){}};
const t=k=>(L[k]||[k,k])[D.set.lang=="ta"?1:0];
const H=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return h};
const addQ=q=>{q.id=H(q.q+q.o[q.a]);BANK.push(q)};
BANK.forEach(q=>q.id=H(q.q+q.o[q.a]));D.extra.forEach(addQ);
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const shuf=(a,r=Math.random)=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=r()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=s=>{s=Math.max(0,s);return(s/60|0)+":"+String(s%60).padStart(2,"0")};
const pr=id=>{const s=D.st[id]||{};return(s.w||0)*3+(s.s?0:1)+Math.random()*.5};
let S={v:"home",f:"all"},X=null,TM=0;
function theme(){const h=document.documentElement;D.set.theme=="auto"?h.removeAttribute("data-theme"):h.setAttribute("data-theme",D.set.theme);h.lang=D.set.lang}
function start(mode,n,mins,pool){clearInterval(TM);const qs=pool.slice(0,n).map(q=>{const ix=D.set.shuf?shuf([0,1,2,3]):[0,1,2,3];return{id:q.id,q:q.q,o:ix.map(k=>q.o[k]),a:ix.indexOf(q.a)}});if(!qs.length)return;X={mode,qs,ans:[],mk:[],vis:[],i:0,tl:mins*60,t0:Date.now()};TM=setInterval(()=>{X.tl--;const e=$("tmr");if(e)e.textContent=fmt(X.tl);if(X.tl<=0)fin()},1000);S.v="exam";R()}
function fin(){clearInterval(TM);let c=0,w=0,s=0;X.qs.forEach((q,k)=>{const a=X.ans[k],st=D.st[q.id]=D.st[q.id]||{s:0,w:0};st.s++;if(a==null)s++;else if(a===q.a)c++;else{w++;st.w++}});const sc=Math.round((c-w*D.set.neg)*100)/100;X.r={t:Date.now(),mode:X.mode,n:X.qs.length,c,w,s,sc,max:X.qs.length,time:Math.round((Date.now()-X.t0)/1000)};D.hist.unshift(X.r);D.hist=D.hist.slice(0,100);save();S.v="res";S.f="all";R()}
const pc=k=>X.mk[k]?(X.ans[k]!=null?"am":"m"):X.ans[k]!=null?"a":X.vis[k]?"u":"";
const head=()=>S.v=="exam"?"":`<div class="hd noprint"><div class="logo"><i>📚</i>TNPSC Prep</div><div class="nav">${["home","hist","bm","prof","set"].map(v=>`<button class="${S.v==v?"p":""}" data-a="go" data-v="${v}">${t(v)}</button>`).join("")}<button data-a="lng">${D.set.lang=="ta"?"EN":"த"}</button><button data-a="thm">◐</button></div></div>`;
const stat=()=>{const h=D.hist,a=h.length?Math.round(h.reduce((s,r)=>s+(r.c+r.w?r.c/(r.c+r.w):0),0)/h.length*100):0;return`<div class="stats"><div>${t("tests")}<b>${h.length}</b></div><div>${t("avg")}<b>${a}%</b></div><div>${t("best")}<b>${h.length?Math.max(...h.map(r=>r.sc)):0}</b></div><div>${t("bank")}<b>${BANK.length}</b></div></div>`};
const hrow=r=>`<tr><td>${new Date(r.t).toLocaleDateString()}</td><td>${t(r.mode)}</td><td>${r.sc}/${r.max}</td><td>${r.c+r.w?Math.round(r.c/(r.c+r.w)*100):0}%</td><td>${fmt(r.time)}</td></tr>`;
const hth=`<tr><th>${"date"}</th></tr>`;
const VV={
home:()=>`<div class="card"><h2 style="margin:0">${t("hi")}${D.profile.name?", "+E(D.profile.name):""} 👋</h2><p style="color:var(--mute);margin:4px 0 0">${E(D.profile.exam)}</p>${stat()}</div><div class="g"><button class="card act" data-a="daily"><b>🗓 ${t("daily")}</b><span>25 ${t("cnt")} · 25 ${t("min")}</span></button><button class="card act" data-a="go" data-v="setup"><b>⚙ ${t("custom")}</b><span>${t("cnt")} / ${t("min")}</span></button><button class="card act" data-a="revt"><b>🔁 ${t("rev")}</b><span>${t("wrong")} ↑</span></button><button class="card act" data-a="bmt"><b>★ ${t("bmt")}</b><span>${D.bm.length}</span></button></div><div class="card"><b>${t("hist")}</b><table>${D.hist.slice(0,5).map(hrow).join("")||`<tr><td>${t("none")}</td></tr>`}</table></div><p style="color:var(--mute);font-size:.85rem">${t("note")}</p>`,
setup:()=>`<div class="card"><h3 style="margin-top:0">${t("custom")}</h3><label>${t("cnt")}</label><select id="cn">${[10,25,50,100,BANK.length].map(n=>`<option value="${n}"${n==25?" selected":""}>${n==BANK.length?t("all")+" ("+n+")":n}</option>`).join("")}</select><label>${t("min")}</label><input id="cm" type="number" min="1" value="25"><label><input id="sf" type="checkbox" style="width:auto"${D.set.shuf?" checked":""}> ${t("shuf")}</label><button class="p w" data-a="cst">${t("start")}</button></div>`,
exam:()=>{const q=X.qs[X.i];X.vis[X.i]=1;return`<div class="ex"><div class="card"><div class="row sp"><b>${t("q")} ${X.i+1}/${X.qs.length}</b><span class="pill" id="tmr">${fmt(X.tl)}</span></div><div class="q">${E(q.q)}</div>${q.o.map((o,k)=>`<button class="o${X.ans[X.i]===k?" sel":""}" data-a="pick" data-v="${k}"><i>${"ABCD"[k]}</i><span>${E(o)}</span></button>`).join("")}<div class="row sp mt"><button data-a="prv">${t("prev")}</button><button data-a="mrk">${X.mk[X.i]?"★ ":"☆ "}${t("mark")}</button><button data-a="clr">${t("clear")}</button><button class="p" data-a="nxt">${t("next")}</button></div></div><div class="card"><b>${t("pal")}</b><div class="pal">${X.qs.map((_,k)=>`<button class="${pc(k)}${k==X.i?" cur":""}" data-a="jmp" data-v="${k}">${k+1}</button>`).join("")}</div><button class="p w" data-a="sub">${t("sub")}</button></div></div>`},
res:()=>{const r=X.r,f=S.f,ac=r.c+r.w?Math.round(r.c/(r.c+r.w)*100):0;return`<div class="card ctr"><div class="ring" style="--p:${Math.round(r.c/r.n*100)}"><b>${r.sc}</b></div><p>${t("score")}: ${r.sc} / ${r.max}</p><div class="stats"><div>${t("right")}<b class="ok">${r.c}</b></div><div>${t("wrong")}<b class="no">${r.w}</b></div><div>${t("skip")}<b>${r.s}</b></div><div>${t("acc")}<b>${ac}%</b></div><div>${t("time")}<b>${fmt(r.time)}</b></div></div><div class="row noprint" style="justify-content:center"><button class="p" onclick="print()">${t("print")}</button><button data-a="go" data-v="home">${t("home")}</button></div></div><div class="row noprint" style="margin-bottom:10px">${["all","wrong","skip"].map(k=>`<button class="${f==k?"p":""}" data-a="flt" data-v="${k}">${t(k)}</button>`).join("")}</div>`+X.qs.map((q,k)=>{const a=X.ans[k],st=a==null?"s":a===q.a?"c":"x";if(f=="wrong"&&st!="x"||f=="skip"&&st!="s")return"";return`<div class="card rv ${st}"><b>${k+1}. ${E(q.q)}</b><p style="margin:6px 0">${t("yours")}: ${a==null?"—":E(q.o[a])}<br>${t("right2")}: <b class="ok">${E(q.o[q.a])}</b></p><div class="row noprint"><button data-a="star" data-v="${q.id}">${D.bm.includes(q.id)?"★":"☆"}</button><button data-a="ai" data-v="${k}">✨ ${t("ai")}</button></div><div class="ex-t" id="e${k}"></div></div>`}).join("")},
hist:()=>`<div class="card"><table><tr><th>${t("date")}</th><th>${t("mode")}</th><th>${t("score")}</th><th>${t("acc")}</th><th>${t("time")}</th></tr>${D.hist.map(hrow).join("")||`<tr><td colspan=5>${t("none")}</td></tr>`}</table></div>`,
bm:()=>{const l=BANK.filter(q=>D.bm.includes(q.id));return`<div class="card"><div class="row sp"><b>★ ${t("bm")} (${l.length})</b><button class="p" data-a="bmt">${t("bmt")}</button></div></div>`+(l.map(q=>`<div class="card"><b>${E(q.q)}</b><p class="ok" style="margin:6px 0">${E(q.o[q.a])}</p><button data-a="star2" data-v="${q.id}">★ ✕</button></div>`).join("")||`<p>${t("none")}</p>`)},
prof:()=>`<div class="card"><h3 style="margin-top:0">${t("prof")}</h3><label>${t("name")}</label><input id="pn" value="${E(D.profile.name)}"><label>${t("exam")}</label><select id="pe">${["TNUSRB","TNPSC Group 4","TNPSC Group 2","TNPSC Group 1","MHC","SSC GD"].map(x=>`<option${x==D.profile.exam?" selected":""}>${x}</option>`).join("")}</select><button class="p w" data-a="sp">${t("save")}</button></div>${stat()}`,
set:()=>`<div class="card"><h3 style="margin-top:0">${t("set")}</h3><label>${t("lang")}</label><select id="sl"><option value="ta"${D.set.lang=="ta"?" selected":""}>தமிழ்</option><option value="en"${D.set.lang=="en"?" selected":""}>English</option></select><label>${t("theme")}</label><select id="st"><option value="auto">Auto</option><option value="light"${D.set.theme=="light"?" selected":""}>Light</option><option value="dark"${D.set.theme=="dark"?" selected":""}>Dark</option></select><label>${t("neg")}</label><select id="sn">${[0,.25,.33,.5].map(n=>`<option${n==D.set.neg?" selected":""}>${n}</option>`).join("")}</select><label><input id="ss" type="checkbox" style="width:auto"${D.set.shuf?" checked":""}> ${t("shuf")}</label><label>Anthropic API key (AI)</label><input id="sk" type="password" value="${E(D.set.key)}" placeholder="sk-ant-…"><button class="p w" data-a="ss">${t("save")}</button></div><div class="card row"><button data-a="exp">${t("exp")}</button><button data-a="imp">${t("imp")}</button><button class="no" data-a="rst">${t("reset")}</button></div>`
};
function R(){theme();$("app").innerHTML=head()+(VV[S.v]||VV.home)();scrollTo(0,0)}
const go=k=>{X.i=Math.min(Math.max(k,0),X.qs.length-1);R()};
const dl=(n,o)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:"application/json"}));a.download=n;a.click()};
const AC={
go:v=>{S.v=v;R()},lng:()=>{D.set.lang=D.set.lang=="ta"?"en":"ta";save();R()},thm:()=>{D.set.theme=D.set.theme=="dark"?"light":"dark";save();R()},
daily:()=>{const d=+new Date().toISOString().slice(0,10).replace(/-/g,"");start("daily",25,25,shuf(BANK,rng(d)))},
revt:()=>start("rev",25,25,BANK.slice().sort((a,b)=>pr(b.id)-pr(a.id))),
bmt:()=>{const p=BANK.filter(q=>D.bm.includes(q.id));start("bm",p.length,Math.max(5,p.length),shuf(p))},
cst:()=>{D.set.shuf=$("sf").checked;save();const n=+$("cn").value;start("custom",n,+$("cm").value||25,shuf(BANK))},
pick:v=>{X.ans[X.i]=+v;R()},nxt:()=>go(X.i+1),prv:()=>go(X.i-1),jmp:v=>go(+v),clr:()=>{X.ans[X.i]=null;R()},mrk:()=>{X.mk[X.i]=!X.mk[X.i];R()},
sub:()=>{const un=X.qs.length-X.ans.filter(a=>a!=null).length;if(confirm(t("conf")+" ("+t("skip")+": "+un+")"))fin()},
flt:v=>{S.f=v;R()},
star:(v,b)=>{const id=+v,i=D.bm.indexOf(id);i<0?D.bm.push(id):D.bm.splice(i,1);save();b.textContent=i<0?"★":"☆"},
star2:v=>{D.bm=D.bm.filter(x=>x!=+v);save();R()},
sp:()=>{D.profile={name:$("pn").value.trim(),exam:$("pe").value};save();S.v="home";R()},
ss:()=>{D.set.lang=$("sl").value;D.set.theme=$("st").value;D.set.neg=+$("sn").value;D.set.shuf=$("ss").checked;D.set.key=$("sk").value.trim();save();R()},
exp:()=>dl("tnpsc-backup.json",{v:1,profile:D.profile,hist:D.hist,bm:D.bm,st:D.st,extra:D.extra}),
imp:()=>$("fi").click(),
rst:()=>{if(confirm(t("reset")+"?")){try{localStorage.removeItem(LSK)}catch(e){}location.reload()}},
ai:async v=>{const q=X.qs[+v],el=$("e"+v);if(!D.set.key){el.textContent=t("nokey");return}el.textContent="…";try{const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":D.set.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:500,messages:[{role:"user",content:(D.set.lang=="ta"?"தமிழில்":"In English")+" briefly explain why this answer is correct (exam prep).\nQ: "+q.q+"\nOptions: "+q.o.join(" | ")+"\nCorrect: "+q.o[q.a]}]})});const j=await r.json();el.textContent=(j.content||[]).map(x=>x.text||"").join("")||JSON.stringify(j.error||j)}catch(e){el.textContent="Error: "+e.message}}
};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b&&AC[b.dataset.a])AC[b.dataset.a](b.dataset.v,b)});
document.addEventListener("keydown",e=>{if(S.v!="exam"||/INPUT|SELECT/.test(e.target.tagName))return;const k="1234abcd".indexOf(e.key.toLowerCase());if(e.key.length==1&&k>=0)AC.pick(k%4);else if(e.key=="ArrowRight"||e.key=="Enter")AC.nxt();else if(e.key=="ArrowLeft")AC.prv()});
$("fi").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(x=>{try{const j=JSON.parse(x);let n=0;const qs=Array.isArray(j)?j:j.extra||[];qs.forEach(q=>{if(q&&q.q&&Array.isArray(q.o)&&q.o.length==4&&q.a>=0&&q.a<4){D.extra.push({q:q.q,o:q.o,a:q.a});addQ({q:q.q,o:q.o,a:q.a});n++}});if(!Array.isArray(j)){D.hist=[...(j.hist||[]),...D.hist].slice(0,100);D.bm=[...new Set([...(j.bm||[]),...D.bm])];Object.assign(D.st,j.st||{});if(j.profile&&j.profile.name)D.profile=j.profile}save();alert("OK · +"+n);R()}catch(err){alert("Invalid JSON")}});e.target.value=""};
window.onbeforeunload=e=>{if(S.v=="exam"){e.preventDefault();e.returnValue=""}};
if("serviceWorker"in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register("sw.js").catch(()=>{});
R();
</script>
</body>
